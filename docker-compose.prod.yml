# ---------------------------------------------------------------------------
# CFT Tracker — ORG / CLOUD PRODUCTION overlay
# Use when the organization provides the server + managed Cloud MySQL.
# Local dev stays on `docker-compose.yml` (app + local db). No change needed.
#
# Usage (on org server):
#   MYSQL_HOST=<cloud-host> MYSQL_USER=<org-user> \
#   MYSQL_PASSWORD=<org-secret> MYSQL_DATABASE=cft_tracker \
#   docker compose -f docker-compose.prod.yml up -d --build
# Frontend VITE_* settings are build args under services.app.build.args
# (runtime env vars never reach the already-baked client bundle).
# ---------------------------------------------------------------------------

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Bake-time (NOT runtime) values: these must reach the client bundle
        # during `npm run build` inside the image — runtime `environment:`
        # entries below cannot change a bundle that is already built.
        # Literals on purpose: compose auto-loads `.env` for interpolation, and
        # a dev machine's .env (local-development/local) must never leak into a
        # production image. To point at another org/host: edit these lines or
        # pass `docker compose build --build-arg VITE_...=...`.
        VITE_STORAGE_PROVIDER: organization-api
        VITE_STORAGE_API_BASE_URL: /api
        VITE_ORGANIZATION_ID: circor-flow-technologies
    container_name: cft-tracker-app
    restart: always
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3001}
      # Cloud MySQL — all values MUST come from org infra / secrets manager.
      - MYSQL_HOST=${MYSQL_HOST:?org MYSQL_HOST is required}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-cft_tracker}
      - MYSQL_USER=${MYSQL_USER:?org MYSQL_USER is required}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?org MYSQL_PASSWORD is required}
      # Runtime copies for the server process; the frontend bundle was baked
      # from the build.args above — rebuild when org host differs.
      - VITE_STORAGE_PROVIDER=organization-api
      - VITE_STORAGE_API_BASE_URL=${VITE_STORAGE_API_BASE_URL:-/api}
      - VITE_ORGANIZATION_ID=${VITE_ORGANIZATION_ID:-circor-flow-technologies}
      - STATE_FILE_PATH=/data/cft-shared-state.json
    volumes:
      # Persist JSON fallback outside the container (dev parity only).
      - cft_app_data:/data

volumes:
  cft_app_data:
    driver: local
