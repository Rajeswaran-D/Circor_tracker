services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cft-tracker-app
    restart: always
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3001}
      - MYSQL_HOST=${MYSQL_HOST:-db}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-cft_tracker}
      - MYSQL_USER=${MYSQL_USER:-cft_app}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-cft_secret_password}
      - VITE_STORAGE_PROVIDER=${VITE_STORAGE_PROVIDER:-organization-api}
      - VITE_STORAGE_API_BASE_URL=${VITE_STORAGE_API_BASE_URL:-/api}
      - VITE_ORGANIZATION_ID=${VITE_ORGANIZATION_ID:-circor-org}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - cft_app_data:/root

  db:
    image: mysql:8.0
    container_name: cft-tracker-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cft_tracker}
      MYSQL_USER: ${MYSQL_USER:-cft_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cft_secret_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - cft_mysql_data:/var/lib/mysql
      - ./database/mysql-schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
      --innodb-log-file-size=64M
      --max-connections=200
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u $$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cft_mysql_data:
    driver: local
  cft_app_data:
    driver: local
